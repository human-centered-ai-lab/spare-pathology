x-app: &app
  image: spare-pathology:1.0.0
  restart: unless-stopped
  init: true
  user: "${SPARE_UID:-${SYNEVAL_UID:-10001}}:${SPARE_GID:-${SYNEVAL_GID:-10001}}"
  volumes:
    - ./instance:/app/instance
    - ./uploads:/app/uploads
    - ./notebooks:/app/notebooks

services:
  spare:
    <<: *app
    build:
      context: .
      args:
        INSTALL_NOTEBOOKS: "${ENABLE_JUPYTER:-0}"
    environment:
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Run ./scripts/configure.sh first}"
      SECRET_KEY: "${SECRET_KEY:?Run ./scripts/configure.sh first}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-0}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-0}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-1}"
      ENABLE_JUPYTER: "${ENABLE_JUPYTER:-0}"
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  spare-tiles:
    <<: *app
    command: ["bash", "/app/scripts/docker_start_tiles.sh"]
    environment:
      SECRET_KEY: "${SECRET_KEY:?Run ./scripts/configure.sh first}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-0}"
      INIT_DATABASE: "0"
    depends_on:
      spare:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  spare-proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      spare:
        condition: service_healthy
      spare-tiles:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
