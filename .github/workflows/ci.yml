name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -r requirements-dev.txt
      - run: pip install -r requirements-notebook.txt
        if: matrix.python == '3.12'
      - run: ruff check app tests
      - run: python -m pytest -q
      - run: pip-audit

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit
      - run: ./scripts/setup_xopat.sh
      - run: npm --prefix tests/e2e ci
      - run: npm --prefix tests/e2e audit
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npm test
        working-directory: tests/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: tests/e2e/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/configure.sh > /dev/null
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: |
          curl --fail http://localhost:8000/healthz
          docker compose restart
          docker compose up -d --wait --wait-timeout 180
          curl --fail http://localhost:8000/healthz
      - run: docker compose logs
        if: failure()
      - run: docker compose down
        if: always()
